spring:
  application:
    name: tea-compliance-engine
  
  datasource:
    url: jdbc:h2:mem:teacompliance_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: false
      
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  cache:
    type: none

logging:
  level:
    com.teacompliance: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: OFF
