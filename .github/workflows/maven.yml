# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  security-events: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run Tests
      run: mvn test
      
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Generate Test Report
      run: mvn jacoco:report
      
    - name: Fail Fast on Dependency Graph Update Failure
      if: ${{ failure() }}
      run: echo 'Failure detected in Dependency Graph step'

    - name: Update dependency graph
      id: dependency-graph
      continue-on-error: true
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      
    - name: Handle Dependency Graph Result
      if: steps.dependency-graph.outcome == 'failure'
      run: |
        echo "Dependency graph submission failed. This may be due to:"
        echo "1. Dependency graph not enabled in repository settings"
        echo "2. Insufficient permissions"
        echo "3. Repository is a fork"
        echo ""
        echo "To enable dependency graph:"
        echo "1. Go to repository Settings > Code security & analysis"
        echo "2. Enable 'Dependency graph' feature"
        echo ""
        echo "Continuing build without dependency graph..."
